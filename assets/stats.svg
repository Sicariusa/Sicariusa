<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="0.5" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#b44bff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g font-family="Consolas,'SF Mono',Menlo,monospace" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
      <rect x="2" y="2" width="278" height="176" rx="18" fill="#0a0216" stroke="url(#edge)" stroke-width="2"/>
      <text x="141" y="92" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="62" font-weight="900" fill="url(#num)" filter="url(#glow)">531</text>
      <text x="141" y="130" font-size="19" fill="#e9e3ff">commits</text>
      <text x="141" y="154" font-size="19" fill="#8f86b3">into one project</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.35s" fill="freeze"/>
      <rect x="308" y="2" width="278" height="176" rx="18" fill="#0a0216" stroke="url(#edge)" stroke-width="2"/>
      <text x="447" y="92" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="62" font-weight="900" fill="url(#num)" filter="url(#glow)">1.6M</text>
      <text x="447" y="130" font-size="19" fill="#e9e3ff">lines scanned</text>
      <text x="447" y="154" font-size="19" fill="#8f86b3">in 121 seconds</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
      <rect x="614" y="2" width="278" height="176" rx="18" fill="#0a0216" stroke="url(#edge)" stroke-width="2"/>
      <text x="753" y="92" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="62" font-weight="900" fill="url(#num)" filter="url(#glow)">150+</text>
      <text x="753" y="130" font-size="19" fill="#e9e3ff">security rules</text>
      <text x="753" y="154" font-size="19" fill="#8f86b3">written by hand</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.85s" fill="freeze"/>
      <rect x="920" y="2" width="278" height="176" rx="18" fill="#0a0216" stroke="url(#edge)" stroke-width="2"/>
      <text x="1059" y="92" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="62" font-weight="900" fill="url(#num)" filter="url(#glow)">0</text>
      <text x="1059" y="130" font-size="19" fill="#e9e3ff">false alarms</text>
      <text x="1059" y="154" font-size="19" fill="#8f86b3">on 48K clean LOC</text>
    </g>
  </g>
</svg>
