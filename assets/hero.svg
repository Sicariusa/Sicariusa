<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030008"/>
      <stop offset="0.55" stop-color="#14032b"/>
      <stop offset="1" stop-color="#3a0a52"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="0.45" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#9b1fff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0333"/>
      <stop offset="1" stop-color="#030008"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
    </linearGradient>
    <mask id="stripes">
      <rect width="1200" height="460" fill="#fff"/>
      <rect y="250" width="1200" height="3" fill="#000"/>
      <rect y="262" width="1200" height="4" fill="#000"/>
      <rect y="275" width="1200" height="6" fill="#000"/>
      <rect y="290" width="1200" height="8" fill="#000"/>
      <rect y="303" width="1200" height="7" fill="#000"/>
    </mask>
    <clipPath id="aboveHorizon"><rect width="1200" height="310"/></clipPath>
    <clipPath id="belowHorizon"><rect y="310" width="1200" height="150"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="url(#sky)"/>

  <g fill="#fff">
    <circle cx="90" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="140" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="100" r="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="55" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="150" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="80" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="30" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="220" r="0.9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="210" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <g clip-path="url(#aboveHorizon)">
    <circle cx="600" cy="335" r="150" fill="#ff2e88" opacity="0.45" filter="url(#sunGlow)"/>
    <circle cx="600" cy="335" r="138" fill="url(#sun)" mask="url(#stripes)"/>
  </g>

  <g clip-path="url(#belowHorizon)">
    <rect y="310" width="1200" height="150" fill="url(#floor)"/>
    <g stroke="#ff2e88" stroke-width="1.4" opacity="0.75">
      <line x1="600" y1="310" x2="600" y2="460"/>
      <line x1="560" y1="310" x2="330" y2="460"/><line x1="640" y1="310" x2="870" y2="460"/>
      <line x1="520" y1="310" x2="60" y2="460"/><line x1="680" y1="310" x2="1140" y2="460"/>
      <line x1="480" y1="310" x2="-210" y2="460"/><line x1="720" y1="310" x2="1410" y2="460"/>
      <line x1="440" y1="310" x2="-480" y2="460"/><line x1="760" y1="310" x2="1680" y2="460"/>
      <line x1="400" y1="310" x2="-750" y2="460"/><line x1="800" y1="310" x2="1950" y2="460"/>
    </g>
    <g stroke="#ff2e88" stroke-width="1.4">
      <line x1="0" x2="1200" y1="310" y2="310"><animate attributeName="y1" values="310;460" dur="3s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="310;460" dur="3s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="310" y2="310"><animate attributeName="y1" values="310;460" dur="3s" begin="-0.75s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="310;460" dur="3s" begin="-0.75s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="310" y2="310"><animate attributeName="y1" values="310;460" dur="3s" begin="-1.5s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="310;460" dur="3s" begin="-1.5s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="310" y2="310"><animate attributeName="y1" values="310;460" dur="3s" begin="-2.25s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="310;460" dur="3s" begin="-2.25s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/></line>
    </g>
  </g>
  <rect y="308" width="1200" height="3" fill="url(#fade)" filter="url(#glow)"/>

  <g font-family="'Arial Black','Segoe UI Black',Impact,sans-serif" font-size="78" font-weight="900" letter-spacing="5" text-anchor="middle">
    <text x="600" y="128" fill="#00f0ff" opacity="0.85">ABDULLAH MOHAMED
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-6 2;4 -1;0 0;0 0" keyTimes="0;0.9;0.92;0.95;0.97;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="128" fill="#ff2e88" opacity="0.85">ABDULLAH MOHAMED
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;6 -2;-4 1;0 0;0 0" keyTimes="0;0.9;0.92;0.95;0.97;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="128" fill="#ffffff" filter="url(#glow)">ABDULLAH MOHAMED</text>
  </g>

  <text x="600" y="176" text-anchor="middle" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="20" letter-spacing="14" fill="#00f0ff" filter="url(#glow)">SOFTWARE ENGINEER</text>

  <g font-family="Consolas,'SF Mono',Menlo,monospace" font-size="23" text-anchor="middle" fill="#ffffff">
    <rect x="310" y="376" width="580" height="46" rx="23" fill="#07000f" fill-opacity="0.85" stroke="#ff2e88" stroke-opacity="0.6"/>
    <text x="600" y="406" opacity="0">i build scanners that catch real exploits
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="406" opacity="0">i ship realtime chat, voice &amp; video
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="406" opacity="0">i automate testing so humans don't have to
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
