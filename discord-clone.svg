<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 320" width="590" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0220"/>
      <stop offset="1" stop-color="#050010"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9a2ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="586" height="316" rx="22" fill="url(#bg)" stroke="#b44bff" stroke-opacity="0.55" stroke-width="2"/>

  <text x="36" y="72" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="15" letter-spacing="2" fill="#c9a2ff">NEW · TYPESCRIPT</text>
  <text x="34" y="128" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="42" font-weight="900" fill="url(#title)">Discord</text>
  <text x="34" y="174" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="42" font-weight="900" fill="url(#title)">Clone</text>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#d9d2f5">
    <text x="36" y="222">Realtime chat, voice &amp; video —</text>
    <text x="36" y="250">with Discord's real permission</text>
    <text x="36" y="278">engine <tspan fill="#c9a2ff" font-weight="700">rebuilt from scratch.</tspan></text>
  </g>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="410" cy="62" r="11" fill="#ff2e88"/>
      <rect x="428" y="50" width="120" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
      <text x="440" y="68" fill="#e9e3ff">gg that was clean</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.28;0.9;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="410" cy="102" r="11" fill="#00f0ff"/>
      <rect x="428" y="90" width="104" height="26" rx="13" fill="#ffffff" fill-opacity="0.08"/>
      <text x="440" y="108" fill="#e9e3ff">hop in voice?</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.48;0.9;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="410" cy="142" r="11" fill="#b44bff"/>
      <rect x="428" y="130" width="72" height="26" rx="13" fill="#b44bff" fill-opacity="0.3"/>
      <text x="440" y="148" fill="#ffffff">!roll d20</text>
    </g>
  </g>

  <g transform="translate(398 186)">
    <rect width="162" height="90" rx="14" fill="#12062a" stroke="#b44bff" stroke-opacity="0.5"/>
    <text x="14" y="24" font-family="Consolas,monospace" font-size="12" fill="#3dff9a">● LIVE · voice</text>
    <g fill="#3dff9a" filter="url(#glow)">
      <rect x="18" y="52" width="8" height="20" rx="4"><animate attributeName="height" values="8;30;12;24;8" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="66;44;62;50;66" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="34" y="52" width="8" height="20" rx="4"><animate attributeName="height" values="22;10;30;14;22" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="52;64;44;60;52" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="50" y="52" width="8" height="20" rx="4"><animate attributeName="height" values="12;28;8;26;12" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="62;46;66;48;62" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="66" y="52" width="8" height="20" rx="4"><animate attributeName="height" values="28;12;22;8;28" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="46;62;52;66;46" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="82" y="52" width="8" height="20" rx="4"><animate attributeName="height" values="10;24;14;30;10" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="64;50;60;44;64" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="98" y="52" width="8" height="20" rx="4"><animate attributeName="height" values="20;8;28;12;20" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="54;66;46;62;54" dur="0.95s" repeatCount="indefinite"/></rect>
      <rect x="114" y="52" width="8" height="20" rx="4"><animate attributeName="height" values="14;30;10;22;14" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="60;44;64;52;60" dur="1.15s" repeatCount="indefinite"/></rect>
      <rect x="130" y="52" width="8" height="20" rx="4"><animate attributeName="height" values="26;10;18;8;26" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="48;64;56;66;48" dur="1.05s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
