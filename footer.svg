<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030008"/>
      <stop offset="1" stop-color="#1b0333"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="0.5" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="200" rx="24"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="200" fill="url(#bg)"/>
    <g stroke="#ff2e88" stroke-width="1.2" opacity="0.45">
      <line x1="600" y1="110" x2="600" y2="200"/>
      <line x1="560" y1="110" x2="360" y2="200"/><line x1="640" y1="110" x2="840" y2="200"/>
      <line x1="520" y1="110" x2="120" y2="200"/><line x1="680" y1="110" x2="1080" y2="200"/>
      <line x1="480" y1="110" x2="-120" y2="200"/><line x1="720" y1="110" x2="1320" y2="200"/>
      <line x1="440" y1="110" x2="-360" y2="200"/><line x1="760" y1="110" x2="1560" y2="200"/>
      <line x1="0" x2="1200" y1="110" y2="110"><animate attributeName="y1" values="110;200" dur="2.4s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="110;200" dur="2.4s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="110" y2="110"><animate attributeName="y1" values="110;200" dur="2.4s" begin="-0.8s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="110;200" dur="2.4s" begin="-0.8s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/></line>
      <line x1="0" x2="1200" y1="110" y2="110"><animate attributeName="y1" values="110;200" dur="2.4s" begin="-1.6s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/><animate attributeName="y2" values="110;200" dur="2.4s" begin="-1.6s" calcMode="spline" keySplines="0.55 0 1 1" repeatCount="indefinite"/></line>
    </g>
    <text x="600" y="78" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="40" font-weight="900" letter-spacing="3" fill="url(#txt)" filter="url(#glow)">LET'S BUILD SOMETHING LOUD.</text>
  </g>
</svg>
